<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TCG CAD Converter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="brand">TCG CAD Converter</span>
    <span class="hint live" id="liveBadge"><i></i>hover to convert</span>
  </header>

  <div class="box">
    <div class="convert">
      <span class="usd">US$100.00</span>
      <span class="arrow">→</span>
      <b id="previewCad">CA$—</b>
    </div>
    <div class="note" id="previewNote">Waiting for today's rate…</div>
  </div>

  <div class="box field">
    <span class="label">Market price percentage (%)</span>
    <input id="percent" type="number" min="1" max="500" step="1" inputmode="decimal">
  </div>

  <div class="box">
    <div class="rate-line"><span>1 USD equals</span><b id="rateVal">—</b></div>
    <div class="rate-meta">
      <span id="rateMeta">No rate yet</span>
      <button class="link" id="refresh">Refresh</button>
    </div>
  </div>

  <footer>Rates from Frankfurter (ECB), refreshed daily. Tooltips never change the page.</footer>

  <script src="popup.js"></script>
</body>
</html>
